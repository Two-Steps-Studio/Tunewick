# Local S3-compatible storage standing in for Cloudflare R2 in development and CI
# (SeaweedFS; R2 speaks the same S3 API, so the app code is identical). Start: pnpm media:start
name: tunewick-media
services:
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: tunewick-media
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024 -volume.max=20
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - media-data:/data
volumes:
  media-data:
