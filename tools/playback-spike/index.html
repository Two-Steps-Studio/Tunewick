<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tunewick playback spike</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
        background: #171515;
        color: #f2ebdd;
      }
      h1 {
        font-size: 22px;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        background: #d8ff3e;
        color: #171515;
        border: 0;
        cursor: pointer;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid #2e2a2a;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      .ok {
        color: #d8ff3e;
      }
      .fail {
        color: #ff5c5c;
      }
      .muted {
        color: #9a928a;
      }
      textarea {
        width: 100%;
        height: 160px;
        background: #1d1b1a;
        color: #f2ebdd;
        font: 12px monospace;
      }
    </style>
  </head>
  <body>
    <h1>Tunewick — playback spike (M3.0)</h1>
    <p class="muted">
      Synthetic test signal (continuous sine sweep), no copyrighted audio. Playback is routed to an
      analyser with zero gain, so nothing is audible. Press start (browsers need a user gesture).
    </p>
    <button id="start" type="button">Start tests</button>
    <p id="status" class="muted">Not started.</p>
    <div id="out"></div>
    <h2>Results (JSON)</h2>
    <textarea id="json" readonly></textarea>
    <script src="spike.js" type="module"></script>
  </body>
</html>
