name: Audio worker image

# Builds services/audio-worker and publishes it to GitHub Container Registry
# (ghcr.io/two-steps-studio/tunewick-audio), for running on any Docker host — e.g. TrueNAS
# (services/audio-worker/truenas.yaml, docs/deployment.md §3b).

on:
  push:
    branches: [main]
    paths:
      - "services/audio-worker/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/audio-worker
          target: production
          push: true
          tags: |
            ghcr.io/two-steps-studio/tunewick-audio:latest
            ghcr.io/two-steps-studio/tunewick-audio:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=TuneWick audio worker
